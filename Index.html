<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공중보건학 암기 어플</title>
  <style>
    :root{--bg:#f7f8fc;--card:#fff;--text:#1f2937;--muted:#6b7280;--pri:#2563eb;--pri2:#1d4ed8;--ok:#059669;--bad:#dc2626;--line:#e5e7eb;--chip:#eef2ff}
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:980px;margin:0 auto;padding:20px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    h1{font-size:28px;margin:0}.sub{color:var(--muted);font-size:14px}
    .panel,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.04)}
    .panel{padding:14px 16px;margin-top:14px}.controls{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.controls>*{min-width:0}
    select,input,button{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);font-size:14px;background:#fff}
    button{cursor:pointer;font-weight:700}.primary{background:var(--pri);color:#fff;border:none}.primary:hover{background:var(--pri2)}.ghost{background:#fff}.ok{background:var(--ok);color:#fff;border:none}.bad{background:var(--bad);color:#fff;border:none}
    .stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.chip{background:var(--chip);padding:8px 12px;border-radius:999px;font-size:13px}
    .card{margin-top:16px;padding:18px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-weight:700;font-size:12px}
    .q{font-size:24px;line-height:1.5;margin:14px 0 8px;font-weight:800}.a{white-space:pre-wrap;line-height:1.7;background:#f9fafb;border:1px dashed var(--line);padding:14px;border-radius:12px;display:none}
    .opts{display:grid;gap:10px;margin-top:10px}.opt{padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left}.opt:hover{border-color:#93c5fd;background:#f8fbff}.correct{border-color:#10b981;background:#ecfdf5}.wrong{border-color:#ef4444;background:#fef2f2}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.row>*{flex:1 1 160px}.muted{color:var(--muted)} .list{margin-top:18px;display:grid;gap:12px}
    details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px} summary{cursor:pointer;font-weight:700}
    .footer{margin:24px 0;color:var(--muted);font-size:13px;text-align:center}
    @media (max-width: 860px){.controls{grid-template-columns:1fr 1fr}.q{font-size:21px}}
    @media (max-width: 540px){.controls{grid-template-columns:1fr}.wrap{padding:14px}.q{font-size:19px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>공중보건학 암기 어플</h1>
      <div class="sub">서술형 · 객관식 4지선다 · OX 학습</div>
    </div>
  </div>

  <div class="panel">
    <div class="controls">
      <select id="partFilter">
        <option value="all">전체 파트</option>
        <option value="1강">1강 건강과 질병 및 공중보건학</option>
        <option value="11강">11강 보건행정</option>
        <option value="12강">12강 사회보장 및 건강보험</option>
      </select>
      <select id="mode">
        <option value="short">서술형</option>
        <option value="mcq">객관식 4지선다</option>
        <option value="ox">OX</option>
      </select>
      <input id="search" placeholder="문제/키워드 검색">
      <select id="scope">
        <option value="all">전체 문제</option>
        <option value="hard">어려움만</option>
        <option value="unseen">아직 안 본 문제</option>
      </select>
      <button class="primary" id="newBtn" type="button">새 문제</button>
      <button class="ghost" id="resetBtn" type="button">기록 초기화</button>
    </div>
    <div class="stats">
      <div class="chip" id="statTotal">총 문제: 0</div>
      <div class="chip" id="statSeen">학습함: 0</div>
      <div class="chip" id="statHard">어려움: 0</div>
      <div class="chip" id="statScore">정답률: 0%</div>
    </div>
  </div>

  <div class="card">
    <div class="badge" id="badgePart">파트</div>
    <div class="q" id="question">로딩 중...</div>
    <div class="muted" id="hint"></div>
    <div class="opts" id="options" style="display:none"></div>
    <div class="a" id="answer"></div>
    <div class="row">
      <button id="showAnswer" type="button">정답/해설 보기</button>
      <button class="ok" id="markEasy" type="button">외웠음</button>
      <button class="bad" id="markHard" type="button">어려움</button>
      <button class="primary" id="nextBtn" type="button">다음 문제</button>
    </div>
  </div>

  <div class="panel">
    <strong>전체 문제/답안 보기</strong>
    <div class="list" id="allList"></div>
  </div>

  <div class="footer">브라우저에 기록이 저장돼서 다음에도 이어서 공부할 수 있어.</div>
</div>
<script>
const qa = [
  {part:'1강', q:'건강의 정의를 서술하시오.', a:'건강이란 단순히 질병이나 허약이 없는 상태가 아니라 신체적, 정신적, 사회적으로 완전한 안녕 상태를 의미한다.', ox:'건강은 단지 질병이 없는 상태만을 의미한다.', oxA:false, mcq:['단지 질병이 없는 상태','신체적·정신적·사회적으로 완전한 안녕 상태','정신적으로 안정된 상태만 의미','운동능력이 높은 상태'], mcqA:1},
  {part:'1강', q:'사회적 건강의 의미를 설명하시오.', a:'사회적 건강이란 개인이 사회 속에서 다른 사람과 원만한 관계를 유지하고 사회적 역할과 책임을 적절히 수행하며 사회생활에 잘 적응하는 상태를 의미한다.', ox:'사회적 건강은 대인관계와 사회적 역할 수행과 관련이 있다.', oxA:true, mcq:['사회적 건강은 경제력만 의미한다','사회생활 적응과 원만한 관계 및 역할 수행 상태이다','신체 기능의 완전성만을 의미한다','질병 유무만으로 판단한다'], mcqA:1},
  {part:'1강', q:'건강개념의 변천에서 제시된 4가지 모형을 쓰시오.', a:'건강개념 변천의 4가지 모형은 생태학적 모형, 사회생태학적 모형, WHO 모형, 전인적 모형이다.', ox:'건강개념 변천의 모형에는 생태학적 모형, 사회생태학적 모형, WHO 모형, 전인적 모형이 있다.', oxA:true, mcq:['생태학적·행동학적·유전학적·WHO 모형','생태학적·사회생태학적·WHO·전인적 모형','사회학적·병리학적·면역학적·전인적 모형','환경적·경제적·정치적·전인적 모형'], mcqA:1},
  {part:'1강', q:'Claude Bernard의 건강관을 설명하시오.', a:'Claude Bernard는 건강을 외부환경 변화에도 내부환경의 항상성이 유지되는 상태로 보았다.', ox:'Claude Bernard는 건강을 사회적 역할 수행의 최적 상태라고 보았다.', oxA:false, mcq:['사회적 역할 수행의 최적 상태','내부환경의 항상성이 유지되는 상태','영적 안녕 상태','보건의료서비스 접근성 상태'], mcqA:1},
  {part:'1강', q:'Wylie의 건강관을 설명하시오.', a:'Wylie는 건강을 유기체가 외부환경의 조건에 부단히 잘 적응해 나가는 상태로 설명하였다.', ox:'Wylie는 건강을 외부환경에 대한 적응 상태로 보았다.', oxA:true, mcq:['외부환경에 적응하는 상태','내부환경 항상성만 중시','사회적 역할만 수행하는 상태','질병이 치료된 상태'], mcqA:0},
  {part:'1강', q:'Parson의 건강관을 설명하시오.', a:'Parson은 건강을 각 개인이 사회적 역할과 임무를 효과적으로 수행할 수 있는 최적의 상태라고 보았다.', ox:'Parson은 건강을 사회적 역할 수행 능력과 관련하여 설명하였다.', oxA:true, mcq:['사회적 역할 수행이 가능한 최적 상태','병원체와 숙주의 균형 상태','경제적 안정 상태','의료이용이 자유로운 상태'], mcqA:0},
  {part:'1강', q:'질병 발생의 3요소를 설명하시오.', a:'질병 발생의 3요소는 숙주, 환경, 병인이다. 이 세 요소의 상호작용에 의해 질병이 발생한다.', ox:'질병 발생의 3요소는 숙주, 환경, 병인이다.', oxA:true, mcq:['숙주·환경·병인','유전·생활양식·정책','사회·문화·경제','인구·자원·조직'], mcqA:0},
  {part:'1강', q:'결함, 장애, 불구의 차이를 설명하시오.', a:'결함은 심리적·생리적·해부학적 구조나 기능의 손상 또는 이상이다. 장애는 결함으로 인해 정상적인 활동 수행 능력이 제한된 상태이다. 불구는 결함이나 장애로 인해 사회적 역할 수행이 제한되는 사회적 불이익 상태이다.', ox:'결함은 사회적 역할 수행의 제한을 의미한다.', oxA:false, mcq:['결함=사회적 불이익, 장애=기능 손상, 불구=활동제한','결함=기능 손상, 장애=활동 제한, 불구=사회적 역할 제한','결함=정신건강, 장애=신체건강, 불구=사회건강','세 용어는 같은 의미이다'], mcqA:1},
  {part:'1강', q:'질병의 자연사를 예방적 관점에서 설명하시오.', a:'질병의 자연사는 질병 발생 이전부터 진행, 회복 또는 사망까지의 전 과정을 말한다. 예방적 관점에서 1차 예방은 건강증진과 특수예방을 통해 질병 발생을 막고, 2차 예방은 조기발견과 조기치료를 하며, 3차 예방은 재활과 후유증 최소화 및 사회복귀를 돕는다.', ox:'2차 예방은 재활과 사회복귀를 목적으로 한다.', oxA:false, mcq:['1차=조기치료, 2차=건강증진, 3차=예방접종','1차=건강증진·특수예방, 2차=조기발견·조기치료, 3차=재활','1차=재활, 2차=예방접종, 3차=검진','1차=격리, 2차=영양, 3차=진단'], mcqA:1},
  {part:'1강', q:'건강과 질병의 결정요인을 설명하시오.', a:'건강과 질병은 생물학적 요인, 유전적 요인, 연령, 성별, 생활양식, 사회경제적 환경, 문화적 요인, 정치적 요인, 물리적·생물학적 환경요인, 보건의료체계 등이 복합적으로 작용하여 결정된다.', ox:'건강과 질병은 단일 원인에 의해 결정된다.', oxA:false, mcq:['단일 원인에 의해 결정','생물학·생활양식·사회경제·환경·보건의료 등 복합요인에 의해 결정','유전만이 결정요인','환경만이 결정요인'], mcqA:1},
  {part:'1강', q:'공중보건학의 정의를 서술하시오.', a:'공중보건학은 조직화된 지역사회의 노력을 통해 질병을 예방하고 수명을 연장하며 건강과 능률을 증진시키는 과학이자 기술이다.', ox:'공중보건학은 개인 진료만을 다루는 학문이다.', oxA:false, mcq:['개인 진료 중심 학문','조직화된 지역사회의 노력으로 건강을 증진하는 과학과 기술','병원경영학','약물치료만 다루는 학문'], mcqA:1},
  {part:'1강', q:'공중보건학과 예방의학을 비교하시오.', a:'예방의학은 개인과 가족을 대상으로 질병예방과 건강증진을 다루며, 공중보건학은 지역사회 주민 전체를 대상으로 집단의 건강향상을 도모한다.', ox:'공중보건학은 주로 지역사회 전체를 대상으로 한다.', oxA:true, mcq:['둘 다 개인만 대상','예방의학은 지역사회, 공중보건학은 개인 대상','예방의학은 개인과 가족, 공중보건학은 지역사회 전체 대상','구분할 수 없다'], mcqA:2},
  {part:'1강', q:'공중보건학의 발전과정을 시대별로 설명하시오.', a:'공중보건학의 발전과정은 고대기, 중세기, 여명기, 확립기, 발전기로 구분한다.', ox:'공중보건학 발전과정에는 고대기, 중세기, 여명기, 확립기, 발전기가 포함된다.', oxA:true, mcq:['고대기·중세기·여명기·확립기·발전기','석기시대·청동기·철기시대','중세기·근대기·디지털기','원시기·고전기·현대기'], mcqA:0},
  {part:'11강', q:'보건행정의 정의를 서술하시오.', a:'보건행정은 국민의 건강을 보호·증진하기 위하여 공공조직이 보건정책을 수립하고 자원과 인력을 조직·관리하여 보건사업을 수행하는 과정이다.', ox:'보건행정은 공공성과 사회성을 지닌다.', oxA:true, mcq:['보건행정은 영리 추구가 최우선이다','보건행정은 보건사업을 조직적으로 수행하는 과정이다','보건행정은 민간병원 운영만을 뜻한다','보건행정은 교육과 무관하다'], mcqA:1},
  {part:'11강', q:'보건행정의 특성을 서술하시오.', a:'보건행정의 특성은 공공성 및 사회성, 조장성 및 교육성, 봉사성, 과학성이다.', ox:'보건행정의 특성에는 공공성·사회성, 조장성·교육성, 봉사성, 과학성이 포함된다.', oxA:true, mcq:['공공성·사회성, 조장성·교육성, 봉사성, 과학성','수익성, 경쟁성, 폐쇄성, 감정성','정치성, 군사성, 상업성, 사적성','공공성만 해당'], mcqA:0},

  {part:'11강', q:'의사결정 과정을 설명하시오.', a:'의사결정은 문제의 인식, 정보수집과 분석, 대안의 개발, 대안의 평가, 최적 대안 선택, 집행, 평가의 과정을 거친다.', ox:'의사결정은 대안의 개발과 평가 과정을 포함한다.', oxA:true, mcq:['문제인식-정보수집-대안개발-대안평가-선택-집행-평가','문제인식-무시-종결','계획-예산만 수행','지휘-보고만 수행'], mcqA:0},

const key='ph_mem_app_fixed_v1';
const state = JSON.parse(localStorage.getItem(key) || '{"seen":{},"hard":{},"correct":0,"attempts":0}');
let current = null;

function $(id){ return document.getElementById(id); }
function save(){ localStorage.setItem(key, JSON.stringify(state)); }
function containsText(item, search){
  const hay = [item.q, item.a, item.ox || '', ...(item.mcq || [])].join(' ');
  return hay.indexOf(search) !== -1;
}
function filtered(){
  const part = $('partFilter').value;
  const search = $('search').value.trim();
  const scope = $('scope').value;
  return qa.filter((x, i) => {
    if (part !== 'all' && x.part !== part) return false;
    if (search && !containsText(x, search)) return false;
    if (scope === 'hard' && !state.hard[i]) return false;
    if (scope === 'unseen' && state.seen[i]) return false;
    return true;
  });
}
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function updateStats(){
  $('statTotal').textContent = '총 문제: ' + qa.length;
  $('statSeen').textContent = '학습함: ' + Object.keys(state.seen).length;
  $('statHard').textContent = '어려움: ' + Object.keys(state.hard).length;
  const rate = state.attempts ? Math.round(state.correct / state.attempts * 100) : 0;
  $('statScore').textContent = '정답률: ' + rate + '%';
}

  filtered().forEach((x) => {
    const d = document.createElement('details');
    const s = document.createElement('summary');
    s.textContent = '[' + x.part + '] ' + x.q;
    const div = document.createElement('div');
    div.style.marginTop = '10px';
    div.style.whiteSpace = 'pre-wrap';
    div.style.lineHeight = '1.7';
    div.textContent = x.a;
    d.appendChild(s);
    d.appendChild(div);
    box.appendChild(d);
  });
}
function showAnswer(show){ $('answer').style.display = show ? 'block' : 'none'; }
function renderCurrent(){
  if (!current) {
    $('badgePart').textContent = '파트';
    $('question').textContent = '조건에 맞는 문제가 없어.';
    $('hint').textContent = '필터를 바꾸거나 검색어를 지워봐.';
    $('answer').textContent = '';
    $('options').style.display = 'none';
    showAnswer(false);
    return;
  }
  const mode = $('mode').value;
  $('badgePart').textContent = current.part + ' · ' + (mode === 'short' ? '서술형' : mode === 'mcq' ? '객관식 4지선다' : 'OX');
  $('question').textContent = mode === 'ox' ? current.ox : current.q;
  $('hint').textContent = mode === 'short' ? '먼저 스스로 답해보고, 정답/해설 보기를 눌러 확인해봐.' : '선택지를 고르거나 O/X를 판단해봐.';
  $('answer').textContent = current.a;
  showAnswer(false);
  const options = $('options');
  options.innerHTML = '';
  if (mode === 'mcq') {
    const arr = shuffle(current.mcq.map((t, i) => ({ t, orig: i })));
    arr.forEach((o) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      b.textContent = o.t;
      b.addEventListener('click', function(){
        state.attempts += 1;
        const ok = o.orig === current.mcqA;
        if (ok) {
          state.correct += 1;
          b.classList.add('correct');
        } else {
          b.classList.add('wrong');
          Array.from(options.children).forEach((c, j) => { if (arr[j].orig === current.mcqA) c.classList.add('correct'); });
        }
        Array.from(options.children).forEach(x => x.disabled = true);
        save(); updateStats(); showAnswer(true);
      });
      options.appendChild(b);
    });
    options.style.display = 'grid';
  } else if (mode === 'ox') {
    ['O','X'].forEach((txt, idx) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      b.textContent = txt;
      b.addEventListener('click', function(){
        state.attempts += 1;
        const chosen = idx === 0;
        const ok = chosen === current.oxA;
        if (ok) {
          state.correct += 1;
          b.classList.add('correct');
        } else {
          b.classList.add('wrong');
          Array.from(options.children).forEach((c, j) => { if ((j === 0) === current.oxA) c.classList.add('correct'); });
        }
        Array.from(options.children).forEach(x => x.disabled = true);
        save(); updateStats(); showAnswer(true);
      });
      options.appendChild(b);
    });
    options.style.display = 'grid';
  } else {
    options.style.display = 'none';
  }
}
function newQuestion(){
  const pool = filtered();
  if (!pool.length) { current = null; renderCurrent(); return; }
  current = pool[Math.floor(Math.random() * pool.length)];
  const idx = qa.indexOf(current);
  state.seen[idx] = 1;
  save();
  updateStats();
  renderCurrent();
}
function markEasy(){ if (!current) return; const i = qa.indexOf(current); delete state.hard[i]; state.seen[i] = 1; save(); updateStats(); }
function markHard(){ if (!current) return; const i = qa.indexOf(current); state.hard[i] = 1; state.seen[i] = 1; save(); updateStats(); }
function resetAll(){ if (confirm('학습 기록을 모두 초기화할까?')) { localStorage.removeItem(key); location.reload(); } }

document.addEventListener('DOMContentLoaded', function(){
  $('newBtn').addEventListener('click', newQuestion);
  $('nextBtn').addEventListener('click', newQuestion);
  $('showAnswer').addEventListener('click', function(){ showAnswer(true); });
  $('markEasy').addEventListener('click', markEasy);
  $('markHard').addEventListener('click', markHard);
  $('resetBtn').addEventListener('click', resetAll);
  ['partFilter','mode','scope'].forEach(id => $(id).addEventListener('change', function(){ renderList(); newQuestion(); }));
  $('search').addEventListener('input', function(){ renderList(); });
  updateStats();
  renderList();
  newQuestion();
});
</script>
</body>
